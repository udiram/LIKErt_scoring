<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Done!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --neutral: #6b7280;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a5b4fc, #4f46e5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #1f2937;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1rem;
            color: white;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .leaderboard {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        .leaderboard h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .leaderboard ul {
            list-style: none;
        }

        .leaderboard li {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }

        .leaderboard li span.name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard li span.count {
            min-width: 24px;
            text-align: right;
        }

        .action-button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .action-button:hover,
        .action-button:focus {
            background: #4338ca;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            outline: none;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 16px;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>All Done!</h1>
        <p>You've reviewed all available cards. Great job, {{ session.name }}! Check back later for more reviews.</p>
        <div class="leaderboard">
            <h3>Leaderboard</h3>
            <ul>
                {% for entry in leaderboard %}
                    <li>
                        <span class="name">{{ entry.name }}</span>
                        <span class="count">{{ entry.count }}</span>
                    </li>
                {% endfor %}
            </ul>
        </div>
        <a href="{{ url_for('index') }}" class="action-button">Back to Home</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Reviewer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        form { margin-top: 50px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Welcome to Model Reviewer! 😎</h1>
    <form action="/set_name" method="post">
        <label for="name">Enter your name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <button type="submit">Start Reviewing! 🚀</button>
    </form>
</body>
</html>
